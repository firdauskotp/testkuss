{% for device in devices %}
<div class="device-card border border-gray-300 dark:border-gray-700 rounded-lg p-4 mb-4">
    <h5 class="text-lg font-medium text-gray-800 dark:text-gray-200 mb-3">Device {{ loop.index }}</h5>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Model</label>
            <input type="text" value="{{ device.Model }}" readonly class="tailwind-input-class bg-gray-100 dark:bg-gray-700 cursor-not-allowed">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Color</label>
            <input type="text" value="{{ device.Color }}" readonly class="tailwind-input-class bg-gray-100 dark:bg-gray-700 cursor-not-allowed">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">EO</label>
            <input type="text" value="{{ device['Current EO'] }}" readonly class="tailwind-input-class bg-gray-100 dark:bg-gray-700 cursor-not-allowed">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Location</label>
            <input type="text" value="{{ device.location }}" readonly class="tailwind-input-class bg-gray-100 dark:bg-gray-700 cursor-not-allowed">
        </div>
        {% if device.image_id %}
        <div class="md:col-span-2">
            <img src="{{ url_for('api_helpers.get_device_image', image_id=device.image_id) }}" alt="Device Image" class="mt-2 rounded-lg max-h-48">
        </div>
        {% endif %}
    </div>
</div>
{% else %}
<p>No devices found for this premise.</p>
{% endfor %}
