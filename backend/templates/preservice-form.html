{% extends "base.html" %}

{% block title %}Preservice Form{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 py-8">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="bg-white shadow-lg rounded-lg overflow-hidden">
            <div class="px-6 py-4 bg-blue-600 border-b border-gray-200">
                <h1 class="text-2xl font-bold text-white">Preservice Essential Oil Requirements</h1>
                <p class="mt-1 text-blue-100">Track essential oil quantities needed for device servicing</p>
            </div>

            <div class="p-6">
                <form method="POST" class="space-y-6">
                    <!-- Date -->
                    <div>
                        <label for="date" class="block text-sm font-medium text-gray-700">Service Date</label>
                        <input type="date" id="date" name="date" value="{{ current_date }}"
                               class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                               required>
                    </div>

                    <!-- Technician -->
                    <div>
                        <label for="technician" class="block text-sm font-medium text-gray-700">Technician</label>
                        <select id="technician" name="technician"
                                class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                                required>
                            <option value="">Select Technician</option>
                            {% for tech in technicians %}
                            <option value="{{ tech }}">{{ tech }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Company -->
                    <div>
                        <label for="company" class="block text-sm font-medium text-gray-700">Company</label>
                        <select id="company" name="company"
                                class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                                required>
                            <option value="">Select Company</option>
                            {% for company in companies %}
                            <option value="{{ company }}">{{ company }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Premise -->
                    <div>
                        <label for="premise" class="block text-sm font-medium text-gray-700">Premise</label>
                        <input type="text" id="premise" name="premise"
                               class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                               placeholder="Enter premise name" required>
                    </div>

                    <!-- Device Model -->
                    <div>
                        <label for="device_model" class="block text-sm font-medium text-gray-700">Device Model</label>
                        <select id="device_model" name="device_model"
                                class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                                required>
                            <option value="">Select Device Model</option>
                            {% for model in device_models %}
                            <option value="{{ model }}">{{ model }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Essential Oil -->
                    <div>
                        <label for="essential_oil" class="block text-sm font-medium text-gray-700">Essential Oil</label>
                        <select id="essential_oil" name="essential_oil"
                                class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                                required>
                            <option value="">Select Essential Oil</option>
                            {% for eo in essential_oils %}
                            <option value="{{ eo }}">{{ eo }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Milliliters -->
                    <div>
                        <label for="milliliters" class="block text-sm font-medium text-gray-700">Milliliters Required</label>
                        <input type="number" id="milliliters" name="milliliters" step="0.1" min="0.1"
                               class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                               placeholder="Enter milliliters (e.g., 5.0)" required>
                    </div>

                    <!-- Notes -->
                    <div>
                        <label for="notes" class="block text-sm font-medium text-gray-700">Notes (Optional)</label>
                        <textarea id="notes" name="notes" rows="3"
                                  class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                                  placeholder="Additional notes about the preservice requirements"></textarea>
                    </div>

                    <!-- Submit Button -->
                    <div class="flex justify-end">
                        <button type="submit"
                                class="inline-flex items-center px-6 py-3 border border-transparent text-base font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                            <svg class="-ml-1 mr-3 h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                            </svg>
                            Add Preservice Entry
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
// Auto-populate premise based on company selection
document.getElementById('company').addEventListener('change', function() {
    const company = this.value;
    if (company) {
        // You could add AJAX call here to fetch premises for the selected company
        // For now, just clear the premise field
        document.getElementById('premise').value = '';
    }
});
</script>
{% endblock %}
