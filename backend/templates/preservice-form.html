{% extends "base.html" %}

{% block title %}Preservice Form{% endblock %}

{% block content %}
<div class="py-8 px-4 sm:px-6 lg:px-8 space-y-8">

    <div class="flex justify-start mb-6">
        <a href="{{ url_for('dashboard') }}"
           class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 dark:focus:ring-offset-gray-900">
            &larr; Back to Dashboard
        </a>
    </div>

    <!-- Form Section -->
    <div class="bg-white dark:bg-gray-800 shadow-xl rounded-lg overflow-hidden">
        <div class="px-6 py-4 bg-indigo-600 border-b border-gray-200">
            <h1 class="text-xl font-bold text-white">Preservice Essential Oil Requirements</h1>
            <p class="mt-1 text-indigo-100">Track essential oil quantities needed for device servicing</p>
        </div>

        <div class="p-6">
            <form method="POST" class="space-y-6">
                    <!-- Date -->
                    <div>
                        <label for="date" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Service Date</label>
                        <input type="date" id="date" name="date" value="{{ current_date }}"
                               class="tailwind-input-class" required>
                    </div>

                    <!-- Technician -->
                    <div>
                        <label for="technician" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Technician</label>
                        <select id="technician" name="technician"
                                class="tailwind-input-class" required>
                            <option value="">Select Technician</option>
                            {% for tech in technicians %}
                            <option value="{{ tech }}">{{ tech }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Company -->
                    <div>
                        <label for="company" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Company</label>
                        <select id="company" name="company"
                                class="tailwind-input-class" required>
                            <option value="">Select Company</option>
                            {% for company in companies %}
                            <option value="{{ company }}">{{ company }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Premise -->
                    <div>
                        <label for="premise" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Premise</label>
                        <input type="text" id="premise" name="premise"
                               class="tailwind-input-class"
                               placeholder="Enter premise name" required>
                    </div>

                    <!-- Device Model -->
                    <div>
                        <label for="device_model" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Device Model</label>
                        <select id="device_model" name="device_model"
                                class="tailwind-input-class" required>
                            <option value="">Select Device Model</option>
                            {% for model in device_models %}
                            <option value="{{ model }}">{{ model }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Essential Oil -->
                    <div>
                        <label for="essential_oil" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Essential Oil</label>
                        <select id="essential_oil" name="essential_oil"
                                class="tailwind-input-class" required>
                            <option value="">Select Essential Oil</option>
                            {% for eo in essential_oils %}
                            <option value="{{ eo }}">{{ eo }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Milliliters -->
                    <div>
                        <label for="milliliters" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Milliliters Required</label>
                        <input type="number" id="milliliters" name="milliliters" step="0.1" min="0.1"
                               class="tailwind-input-class"
                               placeholder="Enter milliliters (e.g., 5.0)" required>
                    </div>

                    <!-- Notes -->
                    <div>
                        <label for="notes" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Notes (Optional)</label>
                        <textarea id="notes" name="notes" rows="3"
                                  class="tailwind-input-class"
                                  placeholder="Additional notes about the preservice requirements"></textarea>
                    </div>

                    <!-- Submit Button -->
                    <div class="flex justify-end">
                        <button type="submit"
                                class="inline-flex items-center px-6 py-3 border border-transparent text-base font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 dark:focus:ring-offset-gray-900">
                            <svg class="-ml-1 mr-3 h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                            </svg>
                            Add Preservice Entry
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
// Auto-populate premise based on company selection
document.getElementById('company').addEventListener('change', function() {
    const company = this.value;
    if (company) {
        // You could add AJAX call here to fetch premises for the selected company
        // For now, just clear the premise field
        document.getElementById('premise').value = '';
    }
});
</script>
{% endblock %}
